<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of certificates and an expiry tracker">
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .bar{transform-box:fill-box;transform-origin:left center;animation:g 6s ease-in-out infinite}
    @keyframes g{0%{transform:scaleX(.3)}40%,100%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>
  <rect width="480" height="300" fill="#f6f3f8"/>
  <g transform="translate(40 52) rotate(-5)"><rect width="170" height="200" rx="10" fill="#fff" stroke="#e2dbe7" stroke-width="2"/></g>
  <g transform="translate(56 40)">
    <rect width="176" height="214" rx="10" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="88" y="38" font-size="12" font-weight="700" fill="#4b145b" text-anchor="middle">CERTIFICATE</text>
    <rect x="48" y="48" width="80" height="4" rx="2" fill="#ff7900"/>
    <g fill="#d9d0df"><rect x="26" y="72" width="124" height="6" rx="3"/><rect x="36" y="86" width="104" height="6" rx="3"/><rect x="30" y="100" width="116" height="6" rx="3"/></g>
    <circle cx="88" cy="150" r="22" fill="none" stroke="#4b145b" stroke-width="2.5"/>
    <circle cx="88" cy="150" r="14" fill="none" stroke="#ff7900" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M30 196h44M102 196h44" stroke="#4b145b" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g transform="translate(256 70)">
    <rect width="196" height="164" rx="12" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#4b145b">Expiry tracker</text>
    <g font-size="9.5" fill="#6b6474"><text x="18" y="60">Gas safety</text><text x="18" y="94">EICR</text><text x="18" y="128">Fire alarm</text></g>
    <g fill="#efe7f2"><rect x="106" y="52" width="72" height="8" rx="4"/><rect x="106" y="86" width="72" height="8" rx="4"/><rect x="106" y="120" width="72" height="8" rx="4"/></g>
    <rect class="bar" x="106" y="52" width="60" height="8" rx="4" fill="#4b145b"/>
    <rect class="bar" x="106" y="86" width="30" height="8" rx="4" fill="#4b145b"/>
    <rect class="bar" x="106" y="120" width="70" height="8" rx="4" fill="#ff7900"/>
    <text x="178" y="148" font-size="8.5" font-weight="700" fill="#e56c00" text-anchor="end">RENEWAL BOOKED</text>
  </g>
</svg>
