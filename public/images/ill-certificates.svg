    <text x="18" y="28" font-size="12.5" font-weight="700" fill="#fff">Gas Safety Record</text>
    <g font-size="9.5" fill="#8a7f93"><text x="18" y="72">Property</text><text x="18" y="106">Engineer</text><text x="18" y="140">Appliances checked</text><text x="18" y="174">Next check due</text></g>
