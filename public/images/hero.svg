<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Illustration of a compliance inspection: a checklist on a clipboard in front of a building with a fire alarm, fire extinguisher and fire exit sign">
  <style>
    .c1,.c2,.c3,.c4{opacity:0;transform-origin:center;animation:tick 8s infinite}
    .c2{animation-delay:.6s}.c3{animation-delay:1.2s}.c4{animation-delay:1.8s}
    .led{animation:blink 2.4s infinite}
    .pen{animation:write 8s ease-in-out infinite}
    @keyframes tick{0%,8%{opacity:0;transform:scale(.6)}14%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
    @keyframes blink{0%,80%,100%{opacity:1}85%,95%{opacity:.2}}
    @keyframes write{0%,100%{transform:translate(0,0)}20%{transform:translate(0,40px)}40%{transform:translate(0,80px)}60%{transform:translate(0,120px)}80%{transform:translate(0,120px)}}
    @media (prefers-reduced-motion:reduce){.c1,.c2,.c3,.c4{animation:none;opacity:1}.led,.pen{animation:none}}
  </style>
  <rect width="560" height="460" rx="18" fill="#f4eef6"/>
  <path d="M0 460V300c60-40 150-50 230-20s170 20 330-30v210z" fill="#ece2f0"/>
  <!-- building -->
  <g fill="none" stroke="#4b145b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="40" y="96" width="250" height="300" fill="#ffffff"/>
    <path d="M40 96h250M40 150h250M40 210h250M40 270h250"/>
    <rect x="62" y="112" width="40" height="26" rx="3"/><rect x="122" y="112" width="40" height="26" rx="3"/><rect x="182" y="112" width="40" height="26" rx="3"/><rect x="242" y="112" width="30" height="26" rx="3"/>
    <rect x="62" y="168" width="40" height="26" rx="3"/><rect x="182" y="168" width="40" height="26" rx="3"/><rect x="242" y="168" width="30" height="26" rx="3"/>
    <rect x="62" y="228" width="40" height="26" rx="3"/><rect x="122" y="228" width="40" height="26" rx="3"/>
    <rect x="128" y="300" width="64" height="96" rx="3"/>
    <path d="M10 396h540"/>
  </g>
  <!-- fire exit sign -->
  <rect x="126" y="282" width="68" height="14" rx="3" fill="#1f8a4c"/>
  <path d="M136 289h10M150 289l6-4v8z" stroke="#fff" stroke-width="2" fill="#fff"/>
  <!-- smoke alarm -->
  <circle cx="122" cy="182" r="11" fill="#fff" stroke="#4b145b" stroke-width="3"/>
  <circle class="led" cx="122" cy="182" r="3" fill="#ff7900"/>
  <!-- extinguisher -->
  <g transform="translate(222 318)">
    <rect x="0" y="12" width="26" height="62" rx="10" fill="#ff7900"/>
    <rect x="6" y="2" width="14" height="12" rx="3" fill="#4b145b"/>
    <path d="M20 6h14l-4 16" fill="none" stroke="#4b145b" stroke-width="3" stroke-linecap="round"/>
    <rect x="4" y="34" width="18" height="14" rx="2" fill="#fff" opacity=".85"/>
  </g>
  <!-- clipboard -->
  <g transform="rotate(4 420 260)">
    <rect x="316" y="116" width="210" height="290" rx="14" fill="#4b145b"/>
    <rect x="330" y="140" width="182" height="252" rx="8" fill="#ffffff"/>
    <rect x="384" y="104" width="74" height="28" rx="8" fill="#6b1d73"/>
    <rect x="400" y="112" width="42" height="8" rx="4" fill="#f4eef6"/>
    <rect x="348" y="160" width="110" height="10" rx="5" fill="#4b145b"/>
    <g fill="#e2d6e8">
      <rect x="384" y="196" width="108" height="8" rx="4"/><rect x="384" y="236" width="92" height="8" rx="4"/>
      <rect x="384" y="276" width="100" height="8" rx="4"/><rect x="384" y="316" width="84" height="8" rx="4"/>
    </g>
    <g fill="none" stroke="#d8cde0" stroke-width="2.5">
      <circle cx="362" cy="200" r="11"/><circle cx="362" cy="240" r="11"/><circle cx="362" cy="280" r="11"/><circle cx="362" cy="320" r="11"/>
    </g>
    <g fill="#ff7900">
      <circle class="c1" cx="362" cy="200" r="11"/><circle class="c2" cx="362" cy="240" r="11"/><circle class="c3" cx="362" cy="280" r="11"/><circle class="c4" cx="362" cy="320" r="11"/>
    </g>
    <path d="M348 364h70" stroke="#4b145b" stroke-width="3" stroke-linecap="round"/>
    <g class="pen"><path d="M486 176l14 -6 6 14-14 6z" fill="#ff7900"/><path d="M500 170l20-46 10 4-20 46z" fill="#4b145b"/></g>
  </g>
</svg>
