<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of certificates with a seal">
  <style>
    .seal{transform-origin:316px 196px;animation:spin 20s linear infinite}
    .back{animation:bob 5s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){.seal,.back{animation:none}}
  </style>
  <rect width="480" height="300" fill="#f4eef6"/>
  <path d="M300 300C300 230 350 180 430 180h50c0 70-50 120-130 120z" fill="#ece2f0"/>
  <g class="back"><rect x="100" y="46" width="196" height="222" rx="10" fill="#ffffff" stroke="#d8cde0" stroke-width="3" transform="rotate(-7 198 157)"/></g>
  <rect x="150" y="34" width="210" height="236" rx="10" fill="#ffffff" stroke="#4b145b" stroke-width="3"/>
  <rect x="172" y="56" width="90" height="10" rx="5" fill="#4b145b"/>
  <g fill="#e2d6e8"><rect x="172" y="90" width="166" height="8" rx="4"/><rect x="172" y="110" width="140" height="8" rx="4"/><rect x="172" y="130" width="154" height="8" rx="4"/><rect x="172" y="150" width="100" height="8" rx="4"/></g>
  <path d="M172 238h70" stroke="#4b145b" stroke-width="3" stroke-linecap="round"/>
  <g class="seal"><circle cx="316" cy="196" r="34" fill="#ff7900"/><circle cx="316" cy="196" r="26" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/></g>
  <circle cx="316" cy="196" r="15" fill="#fff"/>
  <path d="M302 226l-8 32 14-7 9 12 6-34z" fill="#e56c00"/><path d="M330 226l8 32-14-7-9 12-6-34z" fill="#ff7900"/>
</svg>
