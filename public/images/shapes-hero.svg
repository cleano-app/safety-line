<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" aria-hidden="true">
  <defs>
    <path id="leaf" d="M2 108C2 50 48 2 118 2h40c0 60-46 106-116 106z"/>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#4b145b" opacity=".16"/></pattern>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b1d73"/><stop offset="1" stop-color="#4b145b"/></linearGradient>
  </defs>
  <style>
    .f1{animation:f1 9s ease-in-out infinite}
    .f2{animation:f2 11s ease-in-out infinite}
    .f3{animation:f3 13s ease-in-out infinite}
    .spin{transform-origin:92px 96px;animation:spin 30s linear infinite}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,10px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-8px)}}
    @keyframes f3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,8px) rotate(2deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.spin{animation:none}}
  </style>
  <rect x="330" y="270" width="200" height="170" fill="url(#dots)"/>
  <g class="f3"><use href="#leaf" transform="translate(110 120) scale(1.6) rotate(-8)" fill="none" stroke="#e2d6e8" stroke-width="2"/></g>
  <g class="f1"><use href="#leaf" transform="translate(520 252) scale(-2.2 -2.2)" fill="url(#pg)"/></g>
  <g class="f2"><use href="#leaf" transform="translate(40 206) scale(2.2)" fill="#ff7900"/></g>
  <g class="spin"><circle cx="92" cy="96" r="34" fill="none" stroke="#ff7900" stroke-width="3" stroke-dasharray="6 9"/></g>
  <circle cx="500" cy="40" r="12" fill="#ff7900"/>
  <circle cx="510" cy="420" r="8" fill="#4b145b"/>
</svg>
