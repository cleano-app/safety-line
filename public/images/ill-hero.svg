<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Illustration of a compliance audit report with a risk matrix and a renewals calendar">
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .k{stroke-dasharray:24;stroke-dashoffset:24;animation:k 9s infinite}
    .k2{animation-delay:.5s}.k3{animation-delay:1s}.k4{animation-delay:1.5s}
    .pulse{transform-origin:433px 341px;animation:p 3s ease-in-out infinite}
    @keyframes k{0%,6%{stroke-dashoffset:24}14%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
    @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){.k{animation:none;stroke-dashoffset:0}.pulse{animation:none}}
  </style>
  <rect width="560" height="460" rx="16" fill="#f6f3f8"/>
  <!-- risk matrix card (back right) -->
  <g transform="translate(330 56)">
    <rect width="196" height="180" rx="12" fill="#fff" stroke="#e2dbe7" stroke-width="2"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#4b145b">Risk matrix</text>
    <g transform="translate(20 46)">
      <rect x="0" y="0" width="36" height="26" rx="4" fill="#f3d9c4"/><rect x="40" y="0" width="36" height="26" rx="4" fill="#ffb26b"/><rect x="80" y="0" width="36" height="26" rx="4" fill="#ff8f2e"/><rect x="120" y="0" width="36" height="26" rx="4" fill="#ff7900"/>
      <rect x="0" y="30" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="40" y="30" width="36" height="26" rx="4" fill="#f3d9c4"/><rect x="80" y="30" width="36" height="26" rx="4" fill="#ffb26b"/><rect x="120" y="30" width="36" height="26" rx="4" fill="#ff8f2e"/>
      <rect x="0" y="60" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="40" y="60" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="80" y="60" width="36" height="26" rx="4" fill="#f3d9c4"/><rect x="120" y="60" width="36" height="26" rx="4" fill="#ffb26b"/>
      <rect x="0" y="90" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="40" y="90" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="80" y="90" width="36" height="26" rx="4" fill="#efe7f2"/><rect x="120" y="90" width="36" height="26" rx="4" fill="#f3d9c4"/>
    </g>
  </g>
  <!-- calendar card (front left) -->
  <g transform="translate(330 266)">
    <rect width="196" height="140" rx="12" fill="#fff" stroke="#e2dbe7" stroke-width="2"/>
    <rect width="196" height="30" rx="12" fill="#4b145b"/><rect y="18" width="196" height="12" fill="#4b145b"/>
    <text x="16" y="20" font-size="11" font-weight="600" fill="#fff" letter-spacing=".08em">RENEWALS</text>
    <g fill="#e6e0ea">
      <rect x="16" y="44" width="18" height="14" rx="3"/><rect x="42" y="44" width="18" height="14" rx="3"/><rect x="68" y="44" width="18" height="14" rx="3"/><rect x="94" y="44" width="18" height="14" rx="3"/><rect x="120" y="44" width="18" height="14" rx="3"/><rect x="146" y="44" width="18" height="14" rx="3"/>
      <rect x="16" y="68" width="18" height="14" rx="3"/><rect x="42" y="68" width="18" height="14" rx="3"/><rect x="68" y="68" width="18" height="14" rx="3"/><rect x="120" y="68" width="18" height="14" rx="3"/><rect x="146" y="68" width="18" height="14" rx="3"/>
      <rect x="16" y="92" width="18" height="14" rx="3"/><rect x="42" y="92" width="18" height="14" rx="3"/><rect x="68" y="92" width="18" height="14" rx="3"/><rect x="94" y="92" width="18" height="14" rx="3"/><rect x="120" y="92" width="18" height="14" rx="3"/>
    </g>
    <rect x="94" y="68" width="18" height="14" rx="3" fill="#ff7900"/>
    <circle class="pulse" cx="103" cy="75" r="15" fill="none" stroke="#ff7900" stroke-width="2"/>
  </g>
  <!-- audit report (main) -->
  <g transform="translate(40 70)">
    <rect width="250" height="320" rx="14" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#4b145b">Compliance audit</text>
    <rect x="24" y="52" width="80" height="6" rx="3" fill="#e6e0ea"/>
    <path d="M24 76h202" stroke="#ece6f0" stroke-width="2"/>
    <g fill="none" stroke="#4b145b" stroke-width="2">
      <rect x="24" y="98" width="20" height="20" rx="4"/><rect x="24" y="146" width="20" height="20" rx="4"/><rect x="24" y="194" width="20" height="20" rx="4"/><rect x="24" y="242" width="20" height="20" rx="4"/>
    </g>
    <g fill="none" stroke="#ff7900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path class="k" d="M28 108l5 5 8-9"/><path class="k k2" d="M28 156l5 5 8-9"/><path class="k k3" d="M28 204l5 5 8-9"/><path class="k k4" d="M28 252l5 5 8-9"/>
    </g>
    <g fill="#d9d0df"><rect x="58" y="101" width="130" height="7" rx="3.5"/><rect x="58" y="149" width="110" height="7" rx="3.5"/><rect x="58" y="197" width="124" height="7" rx="3.5"/><rect x="58" y="245" width="96" height="7" rx="3.5"/></g>
    <g fill="#eee9f1"><rect x="58" y="113" width="80" height="5" rx="2.5"/><rect x="58" y="161" width="92" height="5" rx="2.5"/><rect x="58" y="209" width="70" height="5" rx="2.5"/><rect x="58" y="257" width="84" height="5" rx="2.5"/></g>
    <path d="M24 290h90" stroke="#4b145b" stroke-width="2" stroke-linecap="round"/>
    <path d="M140 292c10-12 16 6 24-4s12 6 22-2" fill="none" stroke="#4b145b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
