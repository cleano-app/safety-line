<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of a training presentation and an attendance register">
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .sg{stroke-dasharray:60;stroke-dashoffset:60;animation:s 8s infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.2s}
    @keyframes s{0%,8%{stroke-dashoffset:60}22%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
    @media (prefers-reduced-motion:reduce){.sg{animation:none;stroke-dashoffset:0}}
  </style>
  <rect width="480" height="300" fill="#f6f3f8"/>
  <g transform="translate(30 36)">
    <rect width="260" height="168" rx="12" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="20" y="34" font-size="13" font-weight="700" fill="#4b145b">Safeguarding training</text>
    <g fill="#d9d0df"><rect x="20" y="56" width="120" height="7" rx="3.5"/><rect x="20" y="74" width="100" height="7" rx="3.5"/><rect x="20" y="92" width="112" height="7" rx="3.5"/></g>
    <g transform="translate(160 54)"><rect x="0" y="40" width="16" height="40" rx="3" fill="#e2d6e8"/><rect x="22" y="22" width="16" height="58" rx="3" fill="#c9b3d3"/><rect x="44" y="6" width="16" height="74" rx="3" fill="#4b145b"/><rect x="66" y="28" width="16" height="52" rx="3" fill="#ff7900"/></g>
    <path d="M110 168v38M150 168v38M90 206h80" stroke="#4b145b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(300 64)">
    <rect width="150" height="200" rx="12" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#4b145b">Attendance</text>
    <path d="M16 40h118" stroke="#ece6f0" stroke-width="2"/>
    <g fill="#d9d0df"><rect x="16" y="58" width="50" height="6" rx="3"/><rect x="16" y="94" width="42" height="6" rx="3"/><rect x="16" y="130" width="54" height="6" rx="3"/><rect x="16" y="166" width="46" height="6" rx="3"/></g>
    <g fill="none" stroke="#4b145b" stroke-width="2" stroke-linecap="round">
      <path class="sg" d="M80 64c6-10 10 6 16-2s8 4 16-4"/><path class="sg s2" d="M80 100c6-10 10 6 16-2s8 4 16-4"/><path class="sg s3" d="M80 136c6-10 10 6 16-2s8 4 16-4"/>
    </g>
    <path d="M80 172h44" stroke="#c9bfd1" stroke-width="1.5"/>
  </g>
</svg>
