<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Workplace risk assessment with hazards rated, and a signed contract setting out safety duties">
  <style>.sig{stroke-dasharray:110;stroke-dashoffset:110;animation:s 9s ease-in-out infinite}@keyframes s{0%,20%{stroke-dashoffset:110}45%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:110}}@media (prefers-reduced-motion:reduce){.sig{animation:none;stroke-dashoffset:0}}</style>
  <rect width="480" height="300" fill="#f6f3f8"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <g transform="translate(24 26)">
    <rect width="250" height="248" rx="12" fill="#fff" stroke="#d9d0df" stroke-width="1.5"/>
    <text x="18" y="32" font-size="14" font-weight="700" fill="#4b145b">Risk assessment</text>
    <g font-size="9.5" font-weight="600" fill="#8a7f93" letter-spacing=".05em"><text x="18" y="60">HAZARD</text><text x="168" y="60">RISK</text></g>
    <path d="M18 68h214" stroke="#ece6f0" stroke-width="1.5"/>
    <g font-size="11.5" fill="#2b2433"><text x="18" y="96">Working at height</text><text x="18" y="134">Manual handling</text><text x="18" y="172">Hot surfaces</text><text x="18" y="210">Slips and trips</text></g>
    <g fill="none" stroke="#ece6f0" stroke-width="1"><path d="M18 110h214M18 148h214M18 186h214"/></g>
    <g font-size="9.5" font-weight="700" text-anchor="middle">
      <rect x="162" y="83" width="54" height="18" rx="9" fill="#ff7900"/><text x="189" y="96" fill="#fff">High</text>
      <rect x="162" y="121" width="54" height="18" rx="9" fill="#ffd9b8"/><text x="189" y="134" fill="#9a4a00">Medium</text>
      <rect x="162" y="159" width="54" height="18" rx="9" fill="#ffd9b8"/><text x="189" y="172" fill="#9a4a00">Medium</text>
      <rect x="162" y="197" width="54" height="18" rx="9" fill="#f1ebf4"/><text x="189" y="210" fill="#4b145b">Low</text>
    </g>
  </g>
  <g transform="translate(290 46)">
    <rect width="166" height="208" rx="12" fill="#fff" stroke="#d9d0df" stroke-width="1.5"/>
    <text x="16" y="30" font-size="13" font-weight="700" fill="#4b145b">Contract</text>
    <g font-size="10.5" fill="#2b2433"><text x="32" y="62">Scope of work</text><text x="32" y="86">PPE required</text><text x="32" y="110">Safe procedures</text><text x="32" y="134">Responsibilities</text></g>
    <g fill="#ff7900"><circle cx="20" cy="58" r="3.5"/><circle cx="20" cy="82" r="3.5"/><circle cx="20" cy="106" r="3.5"/><circle cx="20" cy="130" r="3.5"/></g>
    <path class="sig" d="M18 178c10-14 16 8 24-4s12 8 20-2 10 6 20-4" fill="none" stroke="#4b145b" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M16 188h134" stroke="#d9d0df" stroke-width="1"/>
    <text x="16" y="200" font-size="9" fill="#8a7f93">Signed by employee</text>
  </g>
  </g>
</svg>
