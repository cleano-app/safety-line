<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" aria-hidden="true">
  <defs><path id="leaf" d="M2 108C2 50 48 2 118 2h40c0 60-46 106-116 106z"/><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.8" fill="#4b145b" opacity=".25"/></pattern></defs>
  <style>.a{animation:a 10s ease-in-out infinite}.b{animation:b 12s ease-in-out infinite}@keyframes a{50%{transform:translate(-8px,6px)}}@keyframes b{50%{transform:translate(8px,-6px)}}@media (prefers-reduced-motion:reduce){.a,.b{animation:none}}</style>
  <rect width="480" height="300" fill="#f4eef6"/>
  <rect x="290" y="30" width="170" height="120" fill="url(#dots)"/>
  <g class="a"><use href="#leaf" transform="translate(60 40) scale(1.5)" fill="#4b145b"/></g>
  <g class="b"><use href="#leaf" transform="translate(420 270) scale(-1.1 -1.1)" fill="#ff7900"/></g>
  <use href="#leaf" transform="translate(300 300) scale(1.4) rotate(-90)" fill="none" stroke="#4b145b" stroke-opacity=".35" stroke-width="2"/>
</svg>
