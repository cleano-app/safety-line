<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Illustration of a safety training session with a trainer and attendees">
  <style>
    .slide{animation:swap 9s infinite}
    .s2{opacity:0;animation:swap2 9s infinite}
    .arm{transform-origin:150px 214px;animation:point 3s ease-in-out infinite}
    @keyframes swap{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    @keyframes swap2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
    @keyframes point{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
    @media (prefers-reduced-motion:reduce){.slide,.s2,.arm{animation:none}.s2{opacity:0}}
  </style>
  <rect width="560" height="400" rx="18" fill="#f4eef6"/>
  <!-- screen -->
  <rect x="190" y="40" width="320" height="190" rx="10" fill="#ffffff" stroke="#4b145b" stroke-width="3"/>
  <g class="slide">
    <rect x="214" y="62" width="130" height="12" rx="6" fill="#4b145b"/>
    <rect x="300" y="96" width="70" height="70" rx="10" fill="#ff7900"/>
    <path d="M335 110v42M314 131h42" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <g fill="#e2d6e8"><rect x="214" y="184" width="270" height="8" rx="4"/><rect x="214" y="200" width="200" height="8" rx="4"/></g>
  </g>
  <g class="s2">
    <rect x="214" y="62" width="150" height="12" rx="6" fill="#4b145b"/>
    <g fill="none" stroke="#4b145b" stroke-width="3"><rect x="226" y="96" width="60" height="70" rx="6"/><rect x="306" y="96" width="60" height="70" rx="6"/><rect x="386" y="96" width="60" height="70" rx="6"/></g>
    <g fill="#ff7900"><circle cx="256" cy="120" r="10"/><circle cx="336" cy="120" r="10"/><circle cx="416" cy="120" r="10"/></g>
    <g fill="#e2d6e8"><rect x="214" y="184" width="240" height="8" rx="4"/><rect x="214" y="200" width="170" height="8" rx="4"/></g>
  </g>
  <!-- trainer -->
  <circle cx="130" cy="150" r="22" fill="#4b145b"/>
  <path d="M96 290v-90a34 34 0 0 1 68 0v90z" fill="#6b1d73"/>
  <path class="arm" d="M150 214l52-40" stroke="#6b1d73" stroke-width="14" stroke-linecap="round"/>
  <rect x="104" y="196" width="20" height="40" rx="4" fill="#ff7900"/>
  <!-- desks and attendees -->
  <g>
    <g fill="#4b145b"><circle cx="250" cy="282" r="17"/><circle cx="350" cy="282" r="17"/><circle cx="450" cy="282" r="17"/></g>
    <g fill="#8a5a96"><path d="M226 340v-24a24 24 0 0 1 48 0v24z"/><path d="M326 340v-24a24 24 0 0 1 48 0v24z"/><path d="M426 340v-24a24 24 0 0 1 48 0v24z"/></g>
    <rect x="200" y="336" width="320" height="16" rx="6" fill="#4b145b"/>
    <g fill="#ffffff"><rect x="238" y="326" width="30" height="10" rx="2"/><rect x="338" y="326" width="30" height="10" rx="2"/><rect x="438" y="326" width="30" height="10" rx="2"/></g>
  </g>
  <path d="M30 352h500" stroke="#d8cde0" stroke-width="3" stroke-linecap="round"/>
</svg>
