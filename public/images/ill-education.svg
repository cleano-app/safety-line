<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of a Single Central Record register and a staff ID badge">
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .k{stroke-dasharray:20;stroke-dashoffset:20;animation:k 8s infinite}.k2{animation-delay:.4s}.k3{animation-delay:.8s}.k4{animation-delay:1.2s}
    .badge{animation:sw 6s ease-in-out infinite;transform-origin:372px 40px}
    @keyframes k{0%,6%{stroke-dashoffset:20}14%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
    @keyframes sw{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
    @media (prefers-reduced-motion:reduce){.k{animation:none;stroke-dashoffset:0}.badge{animation:none}}
  </style>
  <rect width="480" height="300" fill="#f6f3f8"/>
  <g transform="translate(30 34)">
    <rect width="290" height="232" rx="12" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#4b145b">Single Central Record</text>
    <g font-size="8.5" font-weight="600" fill="#8a7f93" letter-spacing=".06em"><text x="20" y="62">NAME</text><text x="150" y="62">DBS</text><text x="196" y="62">ID</text><text x="236" y="62">REFS</text></g>
    <path d="M20 70h250" stroke="#ece6f0" stroke-width="2"/>
    <g fill="#d9d0df"><rect x="20" y="88" width="96" height="7" rx="3.5"/><rect x="20" y="124" width="80" height="7" rx="3.5"/><rect x="20" y="160" width="104" height="7" rx="3.5"/><rect x="20" y="196" width="88" height="7" rx="3.5"/></g>
    <g fill="none" stroke="#ece6f0" stroke-width="1.5"><path d="M20 108h250M20 144h250M20 180h250"/></g>
    <g fill="none" stroke="#ff7900" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="k" d="M152 91l4 4 7-8M198 91l4 4 7-8M240 91l4 4 7-8"/>
      <path class="k k2" d="M152 127l4 4 7-8M198 127l4 4 7-8M240 127l4 4 7-8"/>
      <path class="k k3" d="M152 163l4 4 7-8M198 163l4 4 7-8M240 163l4 4 7-8"/>
      <path class="k k4" d="M152 199l4 4 7-8M198 199l4 4 7-8"/>
    </g>
    <circle cx="246" cy="199" r="5" fill="none" stroke="#4b145b" stroke-width="1.6" stroke-dasharray="2 2"/>
  </g>
  <g class="badge">
    <path d="M372 0v40" stroke="#4b145b" stroke-width="3"/>
    <rect x="306" y="40" width="132" height="176" rx="12" fill="#fff" stroke="#4b145b" stroke-width="2.5"/>
    <rect x="356" y="34" width="32" height="14" rx="4" fill="#4b145b"/>
    <rect x="306" y="40" width="132" height="34" rx="12" fill="#4b145b"/><rect x="306" y="62" width="132" height="12" fill="#4b145b"/>
    <text x="320" y="61" font-size="9" font-weight="600" fill="#fff" letter-spacing=".1em">STAFF</text>
    <circle cx="372" cy="108" r="22" fill="#efe7f2"/><path d="M360 136c2-12 22-12 24 0" fill="#efe7f2"/>
    <rect x="330" y="150" width="84" height="8" rx="4" fill="#d9d0df"/><rect x="342" y="166" width="60" height="6" rx="3" fill="#eee9f1"/>
    <rect x="336" y="184" width="72" height="18" rx="9" fill="#fff3e8"/><text x="372" y="197" font-size="9" font-weight="700" fill="#e56c00" text-anchor="middle">CHECKED</text>
  </g>
</svg>
